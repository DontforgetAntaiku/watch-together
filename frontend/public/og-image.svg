  <!-- headline -->
  <text x="72" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">Press play,</text>
  <text x="72" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="800" fill="#ff7ab0">together.</text>
  <text x="72" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#a9b3d1">Watch videos in sync with friends.</text>
  <text x="72" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#a9b3d1">One short room code. No accounts, no installs.</text>
  <!-- art -->
