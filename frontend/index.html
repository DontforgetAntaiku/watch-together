<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Watch Together" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Many video hosts reject requests that carry another site's address as referrer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4f6fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Watch a video together in sync. Open a page, share a short room code. No accounts, no installs, nothing streamed through the server." />
    <title>Watch Together: watch videos in sync with friends</title>
    <meta name="description" content="Watch videos together in sync with friends far away. Open a page, get a short room code, share it. YouTube, Vimeo, Twitch, direct links, files and shared tabs. Free, open source, no accounts, no installs." />
    <meta name="application-name" content="Watch Together" />
    <!-- Link previews (Telegram, Discord, Slack, X, Facebook …). %SITE_URL% is filled in at build time from SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Watch Together" />
    <meta property="og:title" content="Watch Together: press play, together" />
    <meta property="og:description" content="Watch videos in sync with friends. Share a short room code: no accounts, no installs. YouTube, Vimeo, Twitch, links, files and tabs. Free and open source." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Watch Together: a screen and a phone playing the same video in sync" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Watch Together: press play, together" />
    <meta name="twitter:description" content="Watch videos in sync with friends. A short room code, no accounts, no installs. Free and open source." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
